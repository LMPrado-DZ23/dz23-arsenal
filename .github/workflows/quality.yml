name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # run-evals.py --schema depende de jsonschema. Sem instalar, o script cai no
      # fallback manual e o passo "Evals contra o schema" passa a checar menos do que
      # diz checar — verde silencioso. Instalamos explicitamente para o passo valer.
      - name: Dependências dos verificadores
        run: python -m pip install --quiet jsonschema

      - name: Fins de linha normalizados
        # O repo declara `* text=auto eol=lf`. Blob com CRLF dentro faz todo clone em
        # Windows nascer com git status sujo, e as pessoas param de confiar no diff.
        #
        # --cached é obrigatório aqui: sem ele o git grep varre a cópia de trabalho, e
        # numa máquina com core.autocrlf=true o working tree tem CRLF mesmo com o blob
        # correto no índice — o teste falharia localmente passando no CI, ou pior, o
        # contrário. Queremos saber o que foi COMMITADO, não como o checkout foi montado.
        run: |
          sujos=$(git grep -Il --cached -P "\r$" -- '*.md' '*.py' '*.sh' '*.yml' '*.json' '*.txt' || true)
          if [ -n "$sujos" ]; then
            echo "$sujos"
            echo "::error::há blobs com CRLF no índice, contra o .gitattributes (eol=lf)"
            exit 1
          fi
          echo "CRLF: nenhum blob fora da norma"

      - name: Estrutura das skills
        run: python scripts/check-structure.py

      - name: Cópias embutidas batem com a fonte
        # skill_validator.py e _achar_arsenal.py vivem em scripts/ e dentro de cada skill.
        run: python scripts/check-copies.py

      - name: Validador de cada skill
        # Uma skill sem validate_skill.py não pode contar como aprovada: o loop era
        # `[ -f "$v" ] || continue`, que pulava em silêncio. Agora se exige um por skill.
        run: |
          falhou=0
          # Sem interpretador, todo validador "falha" e a mensagem aponta para as skills.
          # Isso aconteceu em teste local (Git-bash sem python no PATH): dez FALHOU falsos.
          # Falhar aqui diz a verdade — o problema é o ambiente, não a skill.
          command -v python >/dev/null 2>&1 || { echo "::error::python indisponível no PATH"; exit 1; }
          for d in skills/*/; do
            v="${d}scripts/validate_skill.py"
            if [ ! -f "$v" ]; then
              echo "::error::$v ausente — cobertura de validação não é aprovação"
              falhou=1
              continue
            fi
            if ! python "$v"; then
              echo "::error::validador rejeitou $v"
              falhou=1
            fi
          done
          exit $falhou

      - name: Coerência dos evals
        run: python scripts/run-evals.py --check

      - name: Evals contra o schema
        run: python scripts/run-evals.py --schema

      - name: Registros de evals
        run: python scripts/check-eval-results.py

      - name: Estado de execução dos evals
        # Rodar --report em CI expõe a cobertura real a cada push. O script sai 1 enquanto
        # houver cenário sem resultado (estado atual: 99/144), então aqui ele é informativo:
        # publica o número no resumo do run sem bloquear merge. Quando a cobertura subir de
        # patamar, trocar para `python scripts/run-evals.py --report` puro para bloquear.
        #
        # O `|| true` está escrito de propósito. Sem ele o passo dependeria de um detalhe do
        # shell para ser informativo: `cmd | tee` sem `pipefail` devolve o código do último
        # elemento, então o exit 1 do report já era engolido por acidente. Verificado neste
        # bash (`false | tee x >/dev/null` -> exit 0). Confiar nisso deixaria o passo quebrar o
        # build inteiro no dia em alguém adicionar `defaults.run.shell: bash -euo pipefail` ao
        # workflow -- uma mudança inofensiva no papel. Explicitado, e com rm para não deixar
        # report.txt solto no workspace.
        run: |
          python scripts/run-evals.py --report | tee report.txt || true
          tail -n 3 report.txt >> "$GITHUB_STEP_SUMMARY"
          rm -f report.txt

      - name: Links relativos
        run: python scripts/check-links.py .

      - name: Comandos da documentação apontam para arquivos que existem
        # O CONTRIBUTING já mandou copiar um validador não-copiável e mostrou um evals.json
        # rejeitado pelo schema. Quem segue o guia descobre isso perdendo tempo, não aqui.
        run: python scripts/check-docs-runnable.py

      - name: Índice de skills bate com o disco
        # skills/README.md é gerado; edição à mão aqui apodrece (esteve 9/9 linhas erradas).
        run: python scripts/gera-indice-skills.py --check

      - name: Bundle DSH consistente e agents/ sincronizado
        # Os três validadores próprios do bundle existiam mas nunca rodaram no CI. `agents/`
        # é artefato gerado e versionado; sem o build.py --check real, divergir das fontes
        # era invisível.
        working-directory: bundle/dz23-dsh-agency
        run: |
          python check_consistency.py
          python check_sizes.py
          python build.py --check

      - name: Números da documentação batem com o disco
        run: python scripts/check-numbers.py

      - name: Licenças dos componentes
        run: python scripts/check-licenses.py

      - name: Ferramentas sobrevivem a entrada doente
        # Triagem, verificador de claims e descoberta de arsenal recebem JSON malformado,
        # texto hostil e caminhos inexistentes. Um traceback aqui significa que o CI pode
        # morrer por um artefato corrompido em vez de reportar o problema.
        run: python scripts/selftest-ferramentas.py

      - name: Alegações da documentação ainda são verdadeiras
        # Re-executa a experiência por trás de cada frase tipo "X falha quando Y". Sem isto,
        # remover uma guarda deixa o CHANGELOG descrevendo um sistema que não existe mais.
        run: python scripts/audita-alegacoes.py

      - name: Manifesto atualizado
        run: python scripts/build-manifest.py --check

      - name: Quality gate completo
        # `set -o pipefail` + gravação atômica: antes, se o gate morresse antes de
        # escrever gate.json, o passo "Resumo" via always() imprimia "gate.json ausente"
        # e saía 0 — CI verde com o verificador morto.
        run: |
          set -euo pipefail
          python scripts/quality-gate.py --json > gate.json.tmp
          mv gate.json.tmp gate.json

      - name: Resumo
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("gate.json")
          if not p.is_file():
              print("gate.json ausente — o gate não chegou a completar")
              # Isso é falha, não estado neutro.
              raise SystemExit(1)
          d = json.loads(p.read_text(encoding="utf-8"))
          resumo = f"checks: {d['total']} | falhas: {d['falhas']}"
          print(resumo)
          for c in d["checks"]:
              if not c["ok"]:
                  print(f"  FALHA {c['check']}: {c['resumo']}")
          sumario = pathlib.Path(__import__("os").environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
          with sumario.open("a", encoding="utf-8") as fh:
              fh.write(f"## Quality gate\n\n{resumo}\n")
          raise SystemExit(0 if d["ok"] else 1)
          PY

      - name: Publicar relatório do gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: gate.json
          if-no-files-found: ignore
          retention-days: 14
