# Pipeline de referência — build único, digest, gate que bloqueia e promoção.
name: ci-cd
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

permissions:
  contents: read
  id-token: write        # OIDC para a nuvem, sem chave estática
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}

      - name: Install (lockfile)
        run: npm ci --ignore-scripts

      - name: Lint e tipos
        run: npm run lint && npm run typecheck

      - name: Testes
        run: npm test

      - name: Metadados
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:${{ steps.meta.outputs.sha }}
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de imagem (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:${{ steps.meta.outputs.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft app:${{ steps.meta.outputs.sha }} -o spdx-json > sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.spdx.json, retention-days: 30}

      - name: Login no registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Push (digest é o artefato)
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.REGISTRY }}/app:${{ steps.meta.outputs.sha }}
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy do MESMO digest
        run: |
          echo "deploy ${{ needs.build.outputs.digest }} em staging"
          # kubectl set image deploy/app app=$REGISTRY/app@${{ needs.build.outputs.digest }}
          # kubectl rollout status deploy/app --timeout=5m

      - name: Smoke pós-deploy
        run: |
          curl -fsS "$STAGING_URL/health" | grep -q "${{ needs.build.outputs.sha }}"

  deploy-prod:
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production        # aprovação manual configurada no GitHub
    steps:
      - name: Promover digest aprovado
        run: echo "promover ${{ needs.build.outputs.digest }} para produção (mesmo artefato)"

      - name: Verificar saúde e rollback automático
        run: |
          echo "monitorar erro/latência por 10 min; abortar se erro > SLO_ERROR_RATE"
          # kubectl rollout undo deploy/app  (automático no gatilho de falha)
